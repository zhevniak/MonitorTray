name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Make portable zip
        shell: pwsh
        run: Compress-Archive -Path MonitorTray.exe, README.md, LICENSE -DestinationPath MonitorTray-1.0-portable.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonitorTray
          path: |
            MonitorTray.exe
            MonitorTraySetup.exe
            MonitorTray-1.0-portable.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MonitorTray.exe
            MonitorTraySetup.exe
            MonitorTray-1.0-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
