name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Make portable zip
        shell: pwsh
        run: Compress-Archive -Path MonitorTray.exe, README.md, LICENSE -DestinationPath MonitorTray-portable.zip

      # контрольные суммы — по ним автообновление проверяет скачанный файл
      - name: Checksums
        shell: pwsh
        run: |
          $files = 'MonitorTray.exe', 'MonitorTraySetup.exe', 'MonitorTray-portable.zip'
          $lines = foreach ($f in $files) { '{0} *{1}' -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), $f }
          Set-Content -Path SHA256SUMS.txt -Value $lines -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonitorTray
          path: |
            MonitorTray.exe
            MonitorTraySetup.exe
            MonitorTray-portable.zip
            SHA256SUMS.txt

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MonitorTray.exe
            MonitorTraySetup.exe
            MonitorTray-portable.zip
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
